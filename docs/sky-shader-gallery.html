* mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(ve  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xr n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(  uCloudCoverage * 0.23, 0.79, n);\n  float veil = smoothstep(0.52, 0.77, skyDetail(p * 1.8 + 13.0)) * 0.3;\n  color = mix(color, uPrimaryColor * 1.08, (wisps + veil) * mask * uCloudDensity * uCloudCoverage);\n#elif XRIFT_ATMOS_MODE == 2\n  // Direction-space dust/haze, with an optical-depth-like horizon falloff.\n  float n = skyDetail(d * (uScale * 2.0) + vec3(uTime * uSpeed * 0.015, uSeed, 0.0));\n  float dust = (0.3 + 0.7 * n) * exp(-abs(d.y - 0.05) * 2.4) * uHaze;\n  color = mix(color, mix(uSecondaryColor, uPrimaryColor, n), clamp(dust, 0.0, 0.85));\n#else\n  if (d.y > 0.01 && uCloudCoverage > 0.0) {\n    float start = 1.0 / d.y;\n    float finish = min(2.15 / d.y, 55.0);\n    if (finish > start) {\n      float stepSize = (finish - start) / float(XRIFT_SKY_CLOUD_STEPS);\n      float trans = 1.0;\n      vec3 scatter = vec3(0.0);\n      // Direction-space jitter is stable across frames and both XR eyes.\n      float jitter = 0.35 + 0.3 * xriftSkyNoise(d * 350.0);\n      for (int i = 0; i < XRIFT_SKY_CLOUD_STEPS; i++) {\n        if (trans < 0.02) break;\n        vec3 p = d * (start + (float(i) + jitter) * stepSize);\n        float density = cloudDensity(p);\n        if (density > 0.002) {\n          float lightDepth = cloudDensity(p + sunDir * 0.22) * 0.55\n            + cloudDensity(p + sunDir * 0.56) * 0.3;\n          float lit = exp(-lightDepth * 1.4);\n          float silver = pow(sunDot, 24.0) * pow(lit, 3.0) * 0.55;\n          float heightLight = smoothstep(1.0, 1.85, p.y) * 0.15;\n          vec3 albedo = mix(uSecondaryColor, uPrimaryColor, clamp(lit * 0.82 + heightLight, 0.0, 1.0));\n          albedo += uPrimaryColor * silver * uSunStrength;\n          float absorbed = 1.0 - exp(-density * stepSize * 1.4);\n          scatter += trans * absorbed * albedo;\n          trans *= 1.0 - absorbed;\n        }\n      }\n      float fade = smoothstep(0.01, 0.07, d.y);\n      color = mix(color, color * trans + scatter, fade);\n    }\n  }\n#endif\n#if XRIFT_ATMOS_MODE == 3\n  // Distant rain shafts only; deliberately no rapid full-screen lightning.\n  float az = atan(d.z, d.x);\n  vec3 ring = vec3(cos(az), sin(az), uSeed);\n  float rain = pow(xriftSkyFbm(ring * 11.0 + vec3(0.0, 0.0, uTime * uSpeed * 0.03)), 3.0);\n  rain *= smoothstep(-0.03, 0.08, d.y) * (1.0 - smoothstep(0.12, 0.55, d.y));\n  color = mix(color, uSecondaryColor * 0.7, rain * uRain * 3.0);\n#endif\n#if XRIFT_ATMOS_MODE == 4\n  // A lower sea of cloud wisps, kept continuous below the horizon.\n  // Intersect a plane below the camera, rather than stretching one azimuthal\n  // sample vertically down the hemisphere. The distant layer dissolves in haze.\n  vec2 seaUV = d.xz / max(-d.y + 0.14, 0.14);\n  vec3 seaPoint = vec3(seaUV.x, uSeed, seaUV.y) * uScale * 1.8;\n  seaPoint.x += uTime * uSpeed * 0.02;\n  float sea = skyDetail(seaPoint);\n  float billow = smoothstep(0.24, 0.68, sea);\n  float detail = skyDetail(seaPoint * 2.4 + 13.0);\n  vec3 seaColor = mix(uSecondaryColor, uPrimaryColor, 0.4 + billow * 0.48 + detail * 0.1);\n  seaColor = mix(seaColor, uHorizonColor, exp(-abs(d.y) * 8.0) * 0.78);\n  float seaMask = 1.0 - smoothstep(-0.04, 0.07, d.y);\n  color = mix(color, seaColor * 0.9, seaMask);\n#endif\n  if (uRidgeStrength > 0.0) {\n    float far = xriftSkyRidgeMask(d, uRidgeHeight * 0.55, 1.7, uSeed + 8.0);\n    float near = xriftSkyRidgeMask(d, uRidgeHeight, 2.2, uSeed + 17.0);\n    color = mix(color, mix(uHorizonColor, uGroundColor, 0.55), far * uRidgeStrength);\n    color = mix(color, uGroundColor, near * uRidgeStrength);\n  }\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#2d72b4"},"uHorizonColor":{"kind":"color","value":"#d4e7f5"},"uGroundColor":{"kind":"color","value":"#879fab"},"uPrimaryColor":{"kind":"color","value":"#fff8ed"},"uSecondaryColor":{"kind":"color","value":"#657994"},"uScale":{"kind":"number","value":1.4},"uSpeed":{"kind":"number","value":0.28},"uIntensity":{"kind":"number","value":1},"uSeed":{"kind":"number","value":4.7},"uStarCount":{"kind":"number","value":0},"uStarBrightness":{"kind":"number","value":1.8},"uStarSize":{"kind":"number","value":0.095},"uTwinkleSpeed":{"kind":"number","value":0},"uCloudCoverage":{"kind":"number","value":0.72},"uCloudDensity":{"kind":"number","value":1.4},"uSunAzimuth":{"kind":"number","value":-135},"uSunElevation":{"kind":"number","value":48},"uSunSize":{"kind":"number","value":0.3},"uSunStrength":{"kind":"number","value":0.9},"uHaze":{"kind":"number","value":0.25},"uRain":{"kind":"number","value":0},"uRidgeStrength":{"kind":"number","value":0},"uRidgeHeight":{"kind":"number","value":0.045}},"variants":[{"name":"sky","side":"back","transparent":false,"depthWrite":false,"defines":{"XRIFT_ATMOS_MODE":"1"}}],"animatedTimeUniform":"uTime"},"cost":"light","tags":["自然","薄雲","巻雲","秋","cirrus"],"preview":{"azimuth":-110,"elevation":20},"parameters":[{"uniform":"uCloudCoverage","label":"雲の量","kind":"number","min":0,"max":1,"step":0.02,"hint":"0で雲をなくし、1に近づけると空を広く覆います。"},{"uniform":"uCloudDensity","label":"雲の厚み","kind":"number","min":0.1,"max":5,"step":0.05,"hint":"大きくすると雲の内側や底が濃くなります。"},{"uniform":"uSunAzimuth","label":"太陽の方角","kind":"number","min":-180,"max":180,"step":1,"hint":"空全体を回さずに太陽の方角を調整します。"},{"uniform":"uSunElevation","label":"太陽の高さ","kind":"number","min":-10,"max":85,"step":1,"hint":"太陽の高さを度数で設定します。配色は自動で昼夜変化しません。"},{"uniform":"uSunSize","label":"太陽の半径","kind":"number","min":0.15,"max":4,"step":0.05,"hint":"太陽の見かけの半径を度数で設定します。"},{"uniform":"uSunStrength","label":"太陽の光","kind":"number","min":0,"max":2,"step":0.05,"hint":"太陽と雲の縁の光の強さです。"},{"uniform":"uHaze","label":"霞・砂塵の濃さ","kind":"number","min":0,"max":1.5,"step":0.02,"hint":"地平線の霞や大気の色を濃くし eed;\nuniform float uExposure;\nuniform float uRotation;\nuniform float uTime;\nvarying vec3 vDirection;\nconst float XRIFT_SKY_TAU = 6.28318530718;\nconst float XRIFT_SKY_SPHERE_CELLS = 12.56637061;\n\nfloat xriftSkyHash13(vec3 p) {\n  p = fract(p * 0.1031);\n  p += dot(p, p.zyx + 31.32);\n  return fract((p.x + p.y) * p.z);\n}\n\nvec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit > 0.0 ? nearHit : -1.0;\n}\n\nuniform float uCloudCoverage;\nuniform float uCloudDensity;\nuniform float uSunAzimuth;\nuniform float uSunElevation;\nuniform float uSunSize;\nuniform float uSunStrength;\nuniform float uHaze;\nuniform float uRain;\nuniform float uRidgeStrength;\nuniform float uRidgeHeight;\n#ifndef XRIFT_ATMOS_MODE\n#define XRIFT_ATMOS_MODE 0\n#endif\n\nfloat cloudShape(vec3 p) {\n  vec3 q = p * uScale + vec3(uTime * uSpeed * 0.028, uSeed, 0.0);\n  float weather = xriftSkyFbm(vec3(q.x * 0.31, 2.0, q.z * 0.31));\n  float shape = skyDetail(q);\n  float threshold = mix(0.7, 0.18, uCloudCoverage) + (weather - 0.4) * 0.18;\n  return max(shape - threshold, 0.0);\n}\nfloat cloudDensity(vec3 p) {\n  if (p.y < 1.0 || p.y > 2.15 || uCloudCoverage <= 0.0) return 0.0;\n  float h = (p.y - 1.0) / 1.15;\n  float profile = smoothstep(0.0, 0.17, h) * (1.0 - smoothstep(0.48, 1.0, h));\n  return cloudShape(p) * profile * uCloudDensity * 4.0;\n}\n\nvoid main() {\n  vec3 d = skyDirection();\n  vec3 sunDir = xriftSkyBodyDirection(uSunAzimuth, uSunElevation);\n  float sunDot = max(dot(d, sunDir), 0.0);\n  vec3 color = skyGradient(d);\n  float horizon = exp(-abs(d.y) * 7.0);\n  color += uPrimaryColor * pow(sunDot, 20.0) * uSunStrength * 0.15;\n  color = mix(color, uHorizonColor, horizon * uHaze * 0.35);\n  float disc = skyDisc(d, sunDir, radians(uSunSize));\n  color += uPrimaryColor * (disc * 3.0 + pow(sunDot, 320.0) * 0.3) * uSunStrength;\n\n#if XRIFT_ATMOS_MODE == 1\n  // Two wind-sheared high-altitude sheets: no volume march for wispy cirrus.\n  vec2 uv = d.xz / (max(d.y, 0.0) + 0.2);\n  float mask = smoothstep(0.0, 0.18, d.y);\n  vec3 p = vec3(uv.x * 0.7, uv.y * 2.8, uSeed) * uScale;\n  p.x += uTime * uSpeed * 0.02;\n  float curl = xriftSkyFbm(p * 0.5);\n  float n = skyDetail(p + vec3(curl * 1.4, 0.0, 0.0));\n  float wisps = smoothstep(0.57 - uCloudCoverage * 0.23, 0.79, n);\n  float veil = smoothstep(0.52, 0.77, skyDetail(p * 1.8 + 13.0)) * 0.3;\n  color = mix(color, uPrimaryColor * 1.08, (wisps + veil) * mask * uCloudDensity * uCloudCoverage);\n#elif XRIFT_ATMOS_MODE == 2\n  // Direction-space dust/haze, with an optical-depth-like horizon falloff.\n  float n = skyDetail(d * (uScale * 2.0) + vec3(uTime * uSpeed * 0.015, uSeed, 0.0));\n  float dust = (0.3 + 0.7 * n) * exp(-abs(d.y - 0.05) * 2.4) * uHaze;\n  color = mix(color, mix(uSecondaryColor, uPrimaryColor, n), clamp(dust, 0.0, 0.85));\n#else\n  if (d.y > 0.01 && uCloudCoverage > 0.0) {\n    float start = 1.0 / d.y;\n    float finish = min(2.15 / d.y, 55.0);\n    if (finish > start) {\n      float stepSize = (finish - start) / float(XRIFT_SKY_CLOUD_STEPS);\n      float trans = 1.0;\n      vec3 scatter = vec3(0.0);\n      // Direction-space jitter is stable across frames and both XR eyes.\n      float jitter = 0.35 + 0.3 * xriftSkyNoise(d * 350.0);\n      for (int i = 0; i < XRIFT_SKY_CLOUD_STEPS; i++) {\n        if (trans < 0.02) break;\n        vec3 p = d * (start + (float(i) + jitter) * stepSize);\n        float density = cloudDensity(p);\n        if (density > 0.002) {\n          float lightDepth = cloudDensity(p + sunDir * 0.22) * 0.55\n            + cloudDensity(p + sunDir * 0.56) * 0.3;\n          float lit = exp(-lightDepth * 1.4);\n          float silver = pow(sunDot, 24.0) * pow(lit, 3.0) * 0.55;\n          float heightLight = smoothstep(1.0, 1.85, p.y) * 0.15;\n          vec3 albedo = mix(uSecondaryColor, uPrimaryColor, clamp(lit * 0.82 + heightLight, 0.0, 1.0));\n          albedo += uPrimaryColor * silver * uSunStrength;\n          float absorbed = 1.0 - exp(-density * stepSize * 1.4);\n          scatter += trans * absorbed * albedo;\n          trans *= 1.0 - absorbed;\n        }\n      }\n      float fade = smoothstep(0.01, 0.07, d.y);\n      color = mix(color, color * trans + scatter, fade);\n    }\n  }\n#endif\n#if XRIFT_ATMOS_MODE == 3\n  // Distant rain shafts only; deliberately no rapid full-screen lightning.\n  float az = atan(d.z, d.x);\n  vec3 ring = vec3(cos(az), sin(az), uSeed);\n  float rain = pow(xriftSkyFbm(ring * 11.0 + vec3(0.0, 0.0, uTime * uSpeed * 0.03)), 3.0);\n  rain *= smoothstep(-0.03, 0.08, d.y) * (1.0 - smoothstep(0.12, 0.55, d.y));\n  color = mix(color, uSecondaryColor * 0.7, rain * uRain * 3.0);\n#endif\n#if XRIFT_ATMOS_MODE == 4\n  // A lower sea of cloud wisps, kept continuous below the horizon.\n  // Intersect a plane below the camera, rather than stretching one azimuthal\n  // sample vertically down the hemisphere. The distant layer dissolves in haze.\n  vec2 seaUV = d.xz / max(-d.y + 0.14, 0.14);\n  vec3 seaPoint = vec3(seaUV.x, uSeed, seaUV.y) * uScale * 1.8;\n  seaPoint.x += uTime * uSpeed * 0.02;\n  float sea = skyDetail(seaPoint);\n  float billow = smoothstep(0.24, 0.68, sea);\n  float detail = skyDetail(seaPoint * 2.4 + 13.0);\n  vec3 seaColor = mix(uSecondaryColor, uPrimaryColor, 0.4 + billow * 0.48 + detail * 0.1);\n  seaColor = mix(seaColor, uHorizonColor, exp(-abs(d.y) * 8.0) * 0.78);\n  float seaMask = 1.0 - smoothstep(-0.04, 0.07, d.y);\n  color = mix(color, seaColor * 0.9, seaMask);\n#endif\n  if (uRidgeStrength > 0.0) {\n    float far = xriftSkyRidgeMask(d, uRidgeHeight * 0.55, 1.7, uSeed + 8.0);\n    float near = xriftSkyRidgeMask(d, uRidgeHeight, 2.2, uSeed + 17.0);\n    color = mix(color, mix(uHorizonColor, uGroundColor, 0.55), far * uRidgeStrength);\n    color = mix(color, uGroundColor, near * uRidgeStrength);\n  }\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#5facc8"},"uHorizonColor":{"kind":"color","value":"#d9e5de"},"uGroundColor":{"kind":"color","value":"#afc9c8"},"uPrimaryColor":{"kind":"color","value":"#f3ead2"},"uSecondaryColor":{"kind":"color","value":"#9dbdc4"},"uScale":{"kind":"number","value":1.1},"uSpeed":{"kind":"number","value":0.28},"uIntensity":{"kind":"number","value":1},"uSeed":{"kind":"number","value":4.7},"uStarCount":{"kind":"number","value":0},"uStarBrightness":{"kind":"number","value":1.8},"uStarSize":{"kind":"number","value":0.095},"uTwinkleSpeed":{"kind":"number","value":0},"uCloudCoverage":{"kind":"number","value":0.62},"uCloudDensity":{"kind":"number","value":2.2},"uSunAzimuth":{"kind":"number","value":-135},"uSunElevation":{"kind":"number","value":42},"uSunSize":{"kind":"number","value":0.3},"uSunStrength":{"kind":"number","value":0.9},"uHaze":{"kind":"number","value":0.65},"uRain":{"kind":"number","value":0},"uRidgeStrength":{"kind":"number","value":0},"uRidgeHeight":{"kind":"number","value":0.045}},"variants":[{"name":"sky","side":"back","transparent":false,"depthWrite":false,"defines":{"XRIFT_ATMOS_MODE":"2"}}],"animatedTimeUniform":"uTime"},"cost":"light","tags":["海","海岸","霞","夏","coast","haze"],"preview":{"azimuth":-110,"elevation":20},"parameters":[{"uniform":"uSunAzimuth","label":"太陽の方角","kind":"number","min":-180,"max":180,"step":1,"hint":"空全体を回さずに太陽の方角を調整します。"},{"uniform":"uSunElevation","label":"太陽の高さ","kind":"number","min":-10,"max":85,"step":1,"hint":"太陽の高さを度数で設定します。配色は自動で昼夜変化しません。"},{"uniform":"uSunSize","label":"太陽の半径","kind":"number","min":0.15,"max":4,"step":0.05,"hint":"太陽の見かけの半径を度数で設定します。"},{"uniform":"uSunStrength","label":"太陽の光","kind":"number","min":0,"max":2,"step":0.05,"hint":"太陽と雲の縁の光の強さです。"},{"uniform":"uHaze","label":"霞・砂塵の濃さ","kind":"number","min":0,"max":1.5,"step":0.02,"hint":"地平線の霞や大気の色を濃くします。"},{"uniform":"uRidgeStrength","label":"遠景の山","kind":"number","min":0,"max":1,"step":0.05,"hint":"0で山並みを隠します。Sceneの地形とは別の背景表現です。"},{"uniform":"uRidgeHeight","label":"遠景の山の高さ","kind":"number","min":0,"max":0.25,"step":0.005,"hint":"背景の山並みの高さです。"},{"uniform":"uScale","label":"模様の細かさ","kind":"number","min":0.3,"max":5,"step":0.05,"hint":"大きくすると雲や模様が細かくなります。"},{"uniform":"uSpeed","label":"動きの速さ","kind":"number","min":0,"max":2,"step":0.02,"hint":"0で雲や模様の動きを止めます。星の瞬きは別に設定します。"},{"uniform":"uSeed","label":"模様の配置","kind":"number","min":0,"max":50,"step":0.1,"hint":"ノイズの位置を変え、別の雲や模様を作ります。"},{"uniform":"uIntensity","label":"表現の強さ","kind":"number","min":0,"max":3,"step":0.05,"hint":"発光や空の色の強さです。Sceneの露出設定とは独立しています。"},{"uniform":"uPrimaryColor","label":"主な光・雲の色","hint":"雲の明るい面や主役となる発光の色です。","kind":"color"},{"uniform":"uSecondaryColor","label":"影・差し色","hint":"雲の影、天体の模様、発光の差し色です。","kind":"color"},{"uniform":"uZenithColor","label":"天頂・背景の色","hint":"真上または背景の基調色です。","kind":"color"},{"uniform":"uHorizonColor","label":"地平線・散乱光の色","hint":"空の低い位置や淡い散乱光の色です。","kind":"color"},{"uniform":"uGroundColor","label":"下半球の色","hint":"地平線より下の背景色です。","kind":"color"}]},{"id":"amber-cloud-sea","label":"Amber Cloud Sea · 琥珀の雲海","category":"dusk","description":"夕日に染まる頭上の積雲と、眼下に広がる雲海です。空の上下に雲を配置するため、高台や空中のワールドに向きます。","shader":{"kind":"classic-r3f","sourceModulePath":"studio://sky-shader/amber-cloud-sea","vertexShader":"uniform vec3 uCenter;\nvarying vec3 vDirection;\n\nvoid main() {\n  vec3 worldPosition = (modelMatrix * vec4(position, 1.0)).xyz;\n  vec3 worldCenter = (modelMatrix * vec4(uCenter, 1.0)).xyz;\n  vDirection = worldPosition - worldCenter;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}","fragmentShader":"uniform vec3 uZenithColor;\nuniform vec3 uHorizonColor;\nuniform vec3 uGroundColor;\nuniform vec3 uPrimaryColor;\nuniform vec3 uSecondaryColor;\nuniform float uScale;\nuniform float uSpeed;\nuniform float uIntensity;\nuniform float uSeed;\nuniform float uStarCount;\nuniform float uStarBrightness;\nuniform float uStarSize;\nuniform float uTwinkleSpeed;\nuniform float uExposure;\nuniform float uRotation;\nuniform float uTime;\nvarying vec3 vDirection;\nconst float XRIFT_SKY_TAU = 6.28318530718;\nconst float XRIFT_SKY_SPHERE_CELLS = 12.56637061;\n\nfloat xriftSkyHash13(vec3 p) {\n  p = fract(p * 0.1031);\n  p += dot(p, p.zyx + 31.32);\n  return fract((p.x + p.y) * p.z);\n}\n\nvec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette
