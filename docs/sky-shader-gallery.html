x(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit > 0.0 ? nearHit : -1.0;\n}\n\nuniform float uBodyAzimuth;\nuniform float uBodyElevation;\nuniform float uBodySize;\nuniform float uPhase;\nuniform float uHaloRadius;\nuniform float uRingTilt;\nuniform float uNebulaStrength;\n#ifndef XRIFT_CELESTIAL_MODE\n#define XRIFT_CELESTIAL_MODE 0\n#endif\n\nvec3 galacticDust(vec3 d) {\n  vec3 axis = normalize(vec3(0.48, 0.35, -0.8));\n  float latitude = dot(d, axis);\n  float broad = exp(-latitude * latitude * 15.0);\n  float narrow = exp(-latitude * latitude * 95.0);\n  vec3 p = d * uScale * 3.2 + uSeed;\n  float structure = skyDetail(p);\n  float fine = skyDetail(p * 3.1 + structure * 2.5);\n  float darkLane = smoothstep(0.37, 0.63, fine) * narrow;\n  vec3 dust = mix(uPrimaryColor, uSecondaryColor, structure);\n  dust *= (broad * 0.15 + narrow * pow(structure, 2.0) * 2.2);\n  return dust * (1.0 - darkLane * 0.9) * uNebulaStrength;\n}\n\nvoid main() {\n  vec3 d = skyDirection();\n  vec3 axis = xriftSkyBodyDirection(uBodyAzimuth, uBodyElevation);\n  vec3 right = skyRight(axis);\n  vec3 up = cross(axis, right);\n  vec2 uv = skyBodyUV(d, axis);\n  float radius = radians(uBodySize);\n  float angle = length(d - axis);\n  float disk = skyDisc(d, axis, radius);\n  vec3 color = mix(uHorizonColor, uZenithColor, d.y * 0.5 + 0.5);\n  color += galacticDust(d) + skyStars(d);\n#if XRIFT_CELESTIAL_MODE == 0\n  float r = max(sin(radius), 0.0001);\n  vec2 local = uv / r;\n  vec3 normal = vec3(local, sqrt(max(1.0-dot(local,local), 0.0)));\n  float phaseAngle = (1.0 - uPhase) * 3.14159265;\n  float lit = max(dot(normal, vec3(sin(phaseAngle), 0.0, cos(phaseAngle))), 0.0);\n  float maria = smoothstep(0.25, 0.67, skyDetail(normal * 6.0 + uSeed));\n  float craters = skyDetail(normal * 23.0 + 3.0);\n  vec3 moon = uPrimaryColor * (0.53 + maria * 0.45 + craters * 0.17) * (0.035 + lit * 1.4);\n  color = mix(color, moon, disk);\n  float halo = exp(-pow((angle - radians(uHaloRadius)) / 0.018, 2.0));\n  color += uSecondaryColor * (halo * 0.07 + exp(-angle * 11.0) * 0.06) * uIntensity;\n  color = mix(uGroundColor, color, smoothstep(-0.12, 0.03, d.y));\n#elif XRIFT_CELESTIAL_MODE == 1\n  // The tilted galactic core and dark lanes occupy the whole dome.\n  color += galacticDust(xriftSkyRotateY(d, 0.16)) * 0.35;\n  color = mix(uGroundColor, color, smoothstep(-0.13, 0.04, d.y));\n#elif XRIFT_CELESTIAL_MODE == 2\n  // Analytic planet sphere and ray/plane ring intersection with correct depth.\n  float planetRadius = 5.0 * sin(radius);\n  vec3 center = axis * 5.0;\n  vec3 sun = normalize(-axis * 0.65 + right * 0.85 + up * 0.5);\n  float hit = skySphereHit(vec3(0.0), d, center, planetRadius);\n  vec3 n = normalize(d * max(hit, 0.001) - center);\n  float band = sin(n.y * 35.0 + skyDetail(n * 5.0 + uSeed) * 8.0);\n  float turbulence = skyDetail(n * 11.0 + uSeed);\n  vec3 surface = mix(uPrimaryColor, uSecondaryColor, clamp(0.45 + band * 0.24 + turbulence * 0.3, 0.0, 1.0));\n  surface *= 0.035 + max(dot(n, sun), 0.0) * 1.3;\n  float limb = pow(1.0 - max(dot(n, -d), 0.0), 3.0);\n  surface += uSecondaryColor * limb * max(dot(n, sun), 0.0) * 0.4;\n  if (hit > 0.0) color = mix(color, surface, disk);\n  float outer = exp(-pow((angle - radius) / 0.008, 2.0));\n  color += uSecondaryColor * outer * 0.14 * max(dot(d, sun) + 0.5, 0.0);\n  float tilt = radians(uRingTilt);\n  vec3 ringNormal = normalize(up * cos(tilt) - axis * sin(tilt) + right * 0.16);\n  float denom = dot(d, ringNormal);\n  float ringT = dot(center, ringNormal) / (abs(denom) < 0.0001 ? 0.0001 : denom);\n  vec3 ringPos = d * ringT - center;\n  float ringR = length(ringPos) / max(planetRadius, 0.01);\n  float aa = clamp(fwidth(ringR), 0.001, 0.06);\n  float ringMask = smoothstep(1.27-aa, 1.27+aa, ringR) * (1.0-smoothstep(2.15-aa, 2.15+aa, ringR));\n  float gap = 1.0 - smoothstep(0.012, 0.022, abs(ringR - 1.77));\n  // Smooth high-frequency rings at distance instead of aliasing bright lines.\n  float frequencyFade = 1.0 - smoothstep(0.008, 0.035, aa);\n  float bands = 0.62 + 0.15 * sin(ringR * 95.0) * frequencyFade + 0.17 * sin(ringR * 27.0);\n  if (ringT > 0.0 && (hit < 0.0 || ringT < hit) && ringMask > 0.0) {\n    float shadow = skySphereHit(d * ringT + sun * 0.01, sun, center, planetRadius) > 0.0 ? 0.16 : 1.0;\n    vec3 rings = mix(uSecondaryColor, uPrimaryColor, clamp((ringR-1.27)/0.88, 0.0, 1.0));\n    color = mix(color, rings * bands * shadow, ringMask * (0.8 - gap * 0.75));\n  }\n#elif XRIFT_CELESTIAL_MODE == 3\n  vec2 local = uv / max(sin(radius), 0.001);\n  vec3 normal = vec3(local, sqrt(max(1.0 - dot(local, local), 0.0)));\n  vec3 p = normal * uScale * 7.0 + vec3(0.0, uTime * uSpeed * 0.025, uSeed);\n  float convection = skyDetail(p + skyDetail(p * 0.4) * 2.0);\n  float cells = pow(abs(sin(convection * 16.0)), 0.7);\n  float limb = pow(max(normal.z, 0.0), 0.4);\n  vec3 star = mix(uSecondaryColor, uPrimaryColor, cells) * (1.0 + limb * 1.8);\n  float corona = exp(-max(angle-radius, 0.0) * 20.0) * (1.0-disk);\n  float polar = atan(uv.y, uv.x);\n  corona *= 0.5 + 0.2 * sin(polar * 13.0 + uTime * uSpeed * 0.03) + 0.12 * sin(polar * 31.0);\n  color += uSecondaryColor * corona * 0.6;\n  color = mix(color, star, disk);\n#elif XRIFT_CELESTIAL_MODE == 4\n  vec3 p = d * uScale * 2.6 + vec3(uSeed, 0.0, uTime * uSpeed * 0.008);\n  float warp = skyDetail(p * 0.6);\n  float n = skyDetail(p + vec3(warp, -warp, warp) * 2.0);\n  float vein = skyDetail(p * 3.5 + n * 2.0);\n  float smoke = smoothstep(0.25, 0.75, n);\n  float dust = smoothstep(0.37, 0.67, vein);\n  color += mix(uPrimaryColor, uSecondaryColor, smoothstep(0.3, 0.68, n))\n    * smoke * (1.0 - dust * 0.87) * uNebulaStrength * 1.7;\n#elif XRIFT_CELESTIAL_MODE == 5\n  float polar = atan(uv.y, uv.x);\n  float petal = 0.62 + 0.2 * sin(polar * 6.0) + 0.12 * sin(polar * 13.0 + 1.3);\n  float corona = exp(-max(angle-radius, 0.0) / max(radius * 0.42 * petal, 0.001));\n  float ring = exp(-pow((angle - radius) / 0.003, 2.0));\n  color += uPrimaryColor * corona * 1.4 + uSecondaryColor * ring * 2.0;\n  // The occulting disc covers the stars as well as the corona.\n  color = mix(color, uGroundColor, disk);\n#endif\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#030612"},"uHorizonColor":{"kind":"color","value":"#121326"},"uGroundColor":{"kind":"color","value":"#010309"},"uPrimaryColor":{"kind":"color","value":"#9da8bf"},"uSecondaryColor":{"kind":"color","value":"#d5b18e"},"uScale":{"kind":"number","value":1.2},"uSpeed":{"kind":"number","value":0.3},"uIntensity":{"kind":"number","value":1},"uSeed":{"kind":"number","value":9.1},"uStarCount":{"kind":"number","value":10000},"uStarBrightness":{"kind":"number","value":3.1},"uStarSize":{"kind":"number","value":0.085},"uTwinkleSpeed":{"kind":"number","value":0},"uBodyAzimuth":{"kind":"number","value":-110},"uBodyElevation":{"kind":"number","value":25},"uBodySize":{"kind":"number","value":1},"uPhase":{"kind":"number","value":0.8},"uHaloRadius":{"kind":"number","value":22},"uRingTilt":{"kind":"number","value":22},"uNebulaStrength":{"kind":"number","value":1.8}},"variants":[{"name":"sky","side":"back","transparent":false,"depthWrite":false,"defines":{"XRIFT_CELESTIAL_MODE":"1"}}],"animatedTimeUniform":"uTime"},"cost":"medium ojectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}","fragmentShader":"uniform vec3 uZenithColor;\nuniform vec3 uHorizonColor;\nuniform vec3 uGroundColor;\nuniform vec3 uPrimaryColor;\nuniform vec3 uSecondaryColor;\nuniform float uScale;\nuniform float uSpeed;\nuniform float uIntensity;\nuniform float uSeed;\nuniform float uStarCount;\nuniform float uStarBrightness;\nuniform float uStarSize;\nuniform float uTwinkleSpeed;\nuniform float uExposure;\nuniform float uRotation;\nuniform float uTime;\nvarying vec3 vDirection;\nconst float XRIFT_SKY_TAU = 6.28318530718;\nconst float XRIFT_SKY_SPHERE_CELLS = 12.56637061;\n\nfloat xriftSkyHash13(vec3 p) {\n  p = fract(p * 0.1031);\n  p += dot(p, p.zyx + 31.32);\n  return fract((p.x + p.y) * p.z);\n}\n\nvec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit },{"uniform":"uScale","label":"模様の細かさ","kind":"number","min":0.3,"max":5,"step":0.05,"hint":"大きくすると雲や模様が細かくなります。"},{"uniform":"uSpeed","label":"動きの速さ","kind":"number","min":0,"max":2,"step":0.02,"hint":"0で雲や模様の動きを止めます。星の瞬きは別に設定します。"},{"uniform":"uSeed","label":"模様の配置","kind":"number","min":0,"max":50,"step":0.1,"hint":"ノイズの位置を変え、別の雲や模様を作ります。"},{"uniform":"uIntensity","label":"表現の強さ","kind":"number","min":0,"max":3,"step":0.05,"hint":"発光や空の色の強さです。Sceneの露出設定とは独立しています。"},{"uniform":"uPrimaryColor","label":"主な光・雲の色","hint":"雲の明るい面や主役となる発光の色です。","kind":"color"},{"uniform":"uSecondaryColor","label":"影・差し色","hint":"雲の影、天体の模様、発光の差し色です。","kind":"color"},{"uniform":"uZenithColor","label":"天頂・背景の色","hint":"真上または背景の基調色です。","kind":"color"},{"uniform":"uHorizonColor","label":"地平線・散乱光の色","hint":"空の低い位置や淡い散乱光の色です。","kind":"color"},{"uniform":"uGroundColor","label":"下半球の色","hint":"地平線より下の背景色です。","kind":"color"}]},{"id":"ringed-planet","label":"Ringed Planet · 環を持つ惑星","category":"space","description":"縞模様の惑星と幾重もの環を描きます。球と環の前後関係、環に落ちる惑星の影、大気の縁を計算する天体シェーダーです。","shader":{"kind":"classic-r3f","sourceModulePath":"studio://sky-shader/ringed-planet","vertexShader":"uniform vec3 uCenter;\nvarying vec3 vDirection;\n\nvoid main() {\n  vec3 worldPosition = (modelMatrix * vec4(position, 1.0)).xyz;\n  vec3 worldCenter = (modelMatrix * vec4(uCenter, 1.0)).xyz;\n  vDirection = worldPosition - worldCenter;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}","fragmentShader":"uniform vec3 uZenithColor;\nuniform vec3 uHorizonColor;\nuniform vec3 uGroundColor;\nuniform vec3 uPrimaryColor;\nuniform vec3 uSecondaryColor;\nuniform float uScale;\nuniform float uSpeed;\nuniform float uIntensity;\nuniform float uSeed;\nuniform float uStarCount;\nuniform float uStarBrightness;\nuniform float uStarSize;\nuniform float uTwinkleSpeed;\nuniform float uExposure;\nuniform float uRotation;\nuniform float uTime;\nvarying vec3 vDirection;\nconst float XRIFT_SKY_TAU = 6.28318530718;\nconst float XRIFT_SKY_SPHERE_CELLS = 12.56637061;\n\nfloat xriftSkyHash13(vec3 p) {\n  p = fract(p * 0.1031);\n  p += dot(p, p.zyx + 31.32);\n  return fract((p.x + p.y) * p.z);\n}\n\nvec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit > 0.0 ? nearHit : -1.0;\n}\n\nuniform float uBodyAzimuth;\nuniform float uBodyElevation;\nuniform float uBodySize;\nuniform float uPhase;\nuniform float uHaloRadius;\nuniform float uRingTilt;\nuniform float uNebulaStrength;\n#ifndef XRIFT_CELESTIAL_MODE\n#define XRIFT_CELESTIAL_MODE 0\n#endif\n\nvec3 galacticDust(vec3 d) {\n  vec3 axis = normalize(vec3(0.48, 0.35, -0.8));\n  float latitude = dot(d, axis);\n  float broad = exp(-latitude * latitude * 15.0);\n  float narrow = exp(-latitude * latitude * 95.0);\n  vec3 p = d * uScale * 3.2 + uSeed;\n  float structure = skyDetail(p);\n  float fine = skyDetail(p * 3.1 + structure * 2.5);\n  float darkLane = smoothstep(0.37, 0.63, fine) * narrow;\n  vec3 dust = mix(uPrimaryColor, uSecondaryColor, structure);\n  dust *= (broad * 0.15 + narrow * pow(structure, 2.0) * 2.2);\n  return dust * (1.0 - darkLane * 0.9) * uNebulaStrength;\n}\n\nvoid main() {\n  vec3 d = skyDirection();\n  vec3 axis = xriftSkyBodyDirection(uBodyAzimuth, uBodyElevation);\n  vec3 right = skyRight(axis);\n  vec3 up = cross(axis, right);\n  vec2 uv = skyBodyUV(d, axis);\n  float radius = radians(uBodySize);\n  float angle = length(d - axis);\n  float disk = skyDisc(d, axis, radius);\n  vec3 color = mix(uHorizonColor, uZenithColor, d.y * 0.5 + 0.5);\n  color += galacticDust(d) + skyStars(d);\n#if XRIFT_CELESTIAL_MODE == 0\n  float r = max(sin(radius), 0.0001);\n  vec2 local = uv / r;\n  vec3 normal = vec3(local, sqrt(max(1.0-dot(local,local), 0.0)));\n  float phaseAngle = (1.0 - uPhase) * 3.14159265;\n  float lit = max(dot(normal, vec3(sin(phaseAngle), 0.0, cos(phaseAngle))), 0.0);\n  float maria = smoothstep(0.25, 0.67, skyDetail(normal * 6.0 + uSeed));\n  float craters = skyDetail(normal * 23.0 + 3.0);\n  vec3 moon = uPrimaryColor * (0.53 + maria * 0.45 + craters * 0.17) * (0.035 + lit * 1.4);\n  color = mix(color, moon, disk);\n  float halo = exp(-pow((angle - radians(uHaloRadius)) / 0.018, 2.0));\n  color += uSecondaryColor * (halo * 0.07 + exp(-angle * 11.0) * 0.06) * uIntensity;\n  color = mix(uGroundColor, color, smoothstep(-0.12, 0.03, d.y));\n#elif XRIFT_CELESTIAL_MODE == 1\n  // The tilted galactic core and dark lanes occupy the whole dome.\n  color += galacticDust(xriftSkyRotateY(d, 0.16)) * 0.35;\n  color = mix(uGroundColor, color, smoothstep(-0.13, 0.04, d.y));\n#elif XRIFT_CELESTIAL_MODE == 2\n  // Analytic planet sphere and ray/plane ring intersection with correct depth.\n  float planetRadius = 5.0 * sin(radius);\n  vec3 center = axis * 5.0;\n  vec3 sun = normalize(-axis * 0.65 + right * 0.85 + up * 0.5);\n  float hit = skySphereHit(vec3(0.0), d, center, planetRadius);\n  vec3 n = normalize(d * max(hit, 0.001) - center);\n  float band = sin(n.y * 35.0 + skyDetail(n * 5.0 + uSeed) * 8.0);\n  float turbulence = skyDetail(n * 11.0 + uSeed);\n  vec3 surface = mix(uPrimaryColor, uSecondaryColor, clamp(0.45 + band * 0.24 + turbulence * 0.3, 0.0, 1.0));\n  surface *= 0.035 + max(dot(n, sun), 0.0) * 1.3;\n  float limb = pow(1.0 - max(dot(n, -d), 0.0), 3.0);\n  surface += uSecondaryColor * limb * max(dot(n, sun), 0.0) * 0.4;\n  if (hit > 0.0) color = mix(color, surface, disk);\n  float outer = exp(-pow((angle - radius) / 0.008, 2.0));\n  color += uSecondaryColor * outer * 0.14 * max(dot(d, sun) + 0.5, 0.0);\n  float tilt = radians(uRingTilt);\n  vec3 ringNormal = normalize(up * cos(tilt) - axis * sin(tilt) + right * 0.16);\n  float denom = dot(d, ringNormal);\n  float ringT = dot(center, ringNormal) / (abs(denom) < 0.0001 ? 0.0001 : denom);\n  vec3 ringPos = d * ringT - center;\n  float ringR = length(ringPos) / max(planetRadius, 0.01);\n  float aa = clamp(fwidth(ringR), 0.001, 0.06);\n  float ringMask = smoothstep(1.27-aa, 1.27+aa, ringR) * (1.0-smoothstep(2.15-aa, 2.15+aa, ringR));\n  float gap = 1.0 - smoothstep(0.012, 0.022, abs(ringR - 1.77));\n  // Smooth high-frequency rings at distance instead of aliasing bright lines.\n  float frequencyFade = 1.0 - smoothstep(0.008, 0.035, aa);\n  float bands = 0.62 + 0.15 * sin(ringR * 95.0) * frequencyFade + 0.17 * sin(ringR * 27.0);\n  if (ringT > 0.0 && (hit < 0.0 || ringT < hit) && ringMask > 0.0) {\n    float shadow = skySphereHit(d * ringT + sun * 0.01, sun, center, planetRadius) > 0.0 ? 0.16 : 1.0;\n    vec3 rings = mix(uSecondaryColor, uPrimaryColor, clamp((ringR-1.27)/0.88, 0.0, 1.0));\n    color = mix(color, rings * bands * shadow, ringMask * (0.8 - gap * 0.75));\n  }\n#elif XRIFT_CELESTIAL_MODE == 3\n  vec2 local = uv / max(sin(radius), 0.001);\n  vec3 normal = vec3(local, sqrt(max(1.0 - dot(local, local), 0.0)));\n  vec3 p = normal * uScale * 7.0 + vec3(0.0, uTime * uSpeed * 0.025, uSeed);\n  float convection = skyDetail(p + skyDetail(p * 0.4) * 2.0);\n  float cells = pow(abs(sin(convection * 16.0)), 0.7);\n  float limb = pow(max(normal.z, 0.0), 0.4);\n  vec3 star = mix(uSecondaryColor, uPrimaryColor, cells) * (1.0 + limb * 1.8);\n  float corona = exp(-max(angle-radius, 0.0) * 20.0) * (1.0-disk);\n  float polar = atan(uv.y, uv.x);\n  corona *= 0.5 + 0.2 * sin(polar * 13.0 + uTime * uSpeed * 0.03) + 0.12 * sin(polar * 31.0);\n  color += uSecondaryColor * corona * 0.6;\n  color = mix(color, star, disk);\n#elif XRIFT_CELESTIAL_MODE == 4\n  vec3 p = d * uScale * 2.6 + vec3(uSeed, 0.0, uTime * uSpeed * 0.008);\n  float warp = skyDetail(p * 0.6);\n  float n = skyDetail(p + vec3(warp, -warp, warp) * 2.0);\n  float vein = skyDetail(p * 3.5 + n * 2.0);\n  float smoke = smoothstep(0.25, 0.75, n);\n  float dust = smoothstep(0.37, 0.67, vein);\n  color += mix(uPrimaryColor, uSecondaryColor, smoothstep(0.3, 0.68, n))\n    * smoke * (1.0 - dust * 0.87) * uNebulaStrength * 1.7;\n#elif XRIFT_CELESTIAL_MODE == 5\n  float polar = atan(uv.y, uv.x);\n  float petal = 0.62 + 0.2 * sin(polar * 6.0) + 0.12 * sin(polar * 13.0 + 1.3);\n  float corona = exp(-max(angle-radius, 0.0) / max(radius * 0.42 * petal, 0.001));\n  float ring = exp(-pow((angle - radius) / 0.003, 2.0));\n  color += uPrimaryColor * corona * 1.4 + uSecondaryColor * ring * 2.0;\n  // The occulting disc covers the stars as well as the corona.\n  color = mix(color, uGroundColor, disk);\n#endif\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#030612"},"uHorizonColor":{"kind":"color","value":"#121326"},"uGroundColor":{"k 。"},{"uniform":"uNebulaStrength","label":"銀河・星雲の濃さ","kind":"number","min":0,"max":4,"step":0.05,"hint":"0で星雲や銀河の光を消します。"},{"uniform":"uScale","label":"模様の細かさ","kind":"number","min":0.3,"max":5,"step":0.05,"hint":"大きくすると雲や模様が細かくなります。"},{"uniform":"uSeed","label":"模様の配置","kind":"number","min":0,"max":50,"step":0.1,"hint":"ノイズの位置を変え、別の雲や模様を作ります。"},{"uniform":"uIntensity","label":"表現の強さ","kind":"number","min":0,"max":3,"step":0.05,"hint":"発光や空の色の強さです。Sceneの露出設定とは独立しています。"},{"uniform":"uPrimaryColor","label":"主な光・雲の色","hint":"雲の明るい面や主役となる発光の色です。","kind":"color"},{"uniform":"uSecondaryColor","label":"影・差し色","hint":"雲の影、天体の模様、発光の差し色です。","kind":"color"},{"uniform":"uZenithColor","label":"天頂・背景の色","hint":"真上または背景の基調色です。","kind":"color"},{"uniform":"uHorizonColor","label":"地平線・散乱光の色","hint":"空の低い位置や淡い散乱光の色です。","kind":"color"}]},{"id":"red-giant","label":"Red Giant · 赤色の恒星","category":"space","description":"大きな恒星の表面に、対流を模した細かな模様と明るさのむらを描きます。周囲に柔らかなコロナが広がるSF向けの空です。","shader":{"kind":"classic-r3f","sourceModulePath":"studio://sky-shader/red-giant","vertexShader":"uniform vec3 uCenter;\nvarying vec3 vDirection;\n\nvoid main() {\n  vec3 worldPosition = (modelMatrix * vec4(position, 1.0)).xyz;\n  vec3 worldCenter = (modelMatrix * vec4(uCenter, 1.0)).xyz;\n  vDirection = worldPosition - worldCenter;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}","fragmentShader":"uniform vec3 uZenithColor;\nuniform vec3 uHorizonColor;\nuniform vec3 uGroundColor;\nuniform vec3 uPrimaryColor;\nuniform vec3 uSecondaryColor;\nuniform float uScale;\nuniform float uSpeed;\nuniform float uIntensity;\nuniform float uSeed;\nuniform float uStarCount;\nuniform float uStarBrightness;\nuniform float uStarSize;\nuniform float uTwinkleSpeed;\nuniform float uExposure;\nuniform float uRotation;\nuniform float uTime;\nvarying vec3 vDirection;\nconst float XRIFT_SKY_TAU = 6.28318530718;\nconst float XRIFT_SKY_SPHERE_CELLS = 12.56637061;\n\nfloat xriftSkyHash13(vec3 p) {\n  p = fract(p * 0.1031);\n  p += dot(p, p.zyx + 31.32);\n  return fract((p.x + p.y) * p.z);\n}\n\nvec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat xriftSkyStarLayer(\n  vec3 direction,\n  float scale,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  // Project to the dominant cube face. Stars live on a 2D surface, not in\n  // volume cells (the old volume grid discarded most of the requested stars).\n  vec3 a = abs(direction);\n  vec2 face;\n  float faceId;\n  if (a.x >= a.y && a.x >= a.z) {\n    face = direction.yz / max(a.x, 0.0001);\n    faceId = direction.x >= 0.0 ? 0.0 : 1.0;\n  } else if (a.y >= a.z) {\n    face = direction.xz / max(a.y, 0.0001);\n    faceId = direction.y >= 0.0 ? 2.0 : 3.0;\n  } else {\n    face = direction.xy / max(a.z, 0.0001);\n    faceId = direction.z >= 0.0 ? 4.0 : 5.0;\n  }\n  vec2 p = face * scale;\n  // Derivatives must precede the non-uniform star-cell branch.\n  float pixel = max(length(fwidth(p)) * 0.5, 0.0001);\n  float probability = clamp(count / (24.0 * scale * scale), 0.0, 1.0);\n  vec3 cell = vec3(floor(p), faceId * 31.0 + scale);\n  vec3 rnd = xriftSkyHash33(cell);\n  if (rnd.x >= probability || count <= 0.0) return 0.0;\n  vec2 center = 0.2 + 0.6 * xriftSkyHash33(cell + 19.19).xy;\n  float dist = length(fract(p) - center);\n  float authoredRadius = clamp(size * (0.45 + 0.55 * rnd.z), 0.005, 0.18);\n  float radius = max(authoredRadius, pixel);\n  float energy = min(1.0, authoredRadius * authoredRadius / (pixel * pixel));\n  float core = exp(-dist * dist / max(radius * radius, 0.00001) * 2.6);\n  float halo = exp(-dist * dist / max(radius * radius, 0.00001) * 0.65) * 0.16;\n  // Setting the speed to zero disables twinkling, not just time advancement.\n  float twinkle = mix(1.0, 0.88 + 0.12 * sin(time * twinkleSpeed *\n    (0.5 + rnd.z) + rnd.y * XRIFT_SKY_TAU), step(0.0001, twinkleSpeed));\n  return (core + halo) * energy * (0.45 + 1.55 * rnd.y * rnd.y) * twinkle;\n}\n\n/** Sums the three star layers so a preset only spends one call on them. */\nfloat xriftSkyStarField(\n  vec3 direction,\n  float count,\n  float size,\n  float time,\n  float twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit > 0.0 ? nearHit : -1.0;\n}\n\nuniform float uBodyAzimuth;\nuniform float uBodyElevation;\nuniform float uBodySize;\nuniform float uPhase;\nuniform float uHaloRadius;\nuniform float uRingTilt;\nuniform float uNebulaStrength;\n#ifndef XRIFT_CELESTIAL_MODE\n#define XRIFT_CELESTIAL_MODE 0\n#endif\n\nvec3 galacticDust(vec3 d) {\n  vec3 axis = normalize(vec3(0.48, 0.35, -0.8));\n  float latitude = dot(d, axis);\n  float broad = exp(-latitude * latitude * 15.0);\n  float narrow = exp(-latitude * latitude * 95.0);\n  vec3 p = d * uScale * 3.2 + uSeed;\n  float structure = skyDetail(p);\n  float fine = skyDetail(p * 3.1 + structure * 2.5);\n  float darkLane = smoothstep(0.37, 0.001) - center);\n  float band = sin(n.y * 35.0 + skyDetail(n * 5.0 + uSeed) * 8.0);\n  float turbulence = skyDetail(n * 11.0 + uSeed);\n  vec3 surface = mix(uPrimaryColor, uSecondaryColor, clamp(0.45 + band * 0.24 + turbulence * 0.3, 0.0, 1.0));\n  surface *= 0.035 + max(dot(n, sun), 0.0) * 1.3;\n  float limb = pow(1.0 - max(dot(n, -d), 0.0), 3.0);\n  surface += uSecondaryColor * limb * max(dot(n, sun), 0.0) * 0.4;\n  if (hit > 0.0) color = mix(color, surface, disk);\n  float outer = exp(-pow((angle - radius) / 0.008, 2.0));\n  color += uSecondaryColor * outer * 0.14 * max(dot(d, sun) + 0.5, 0.0);\n  float tilt = radians(uRingTilt);\n  vec3 ringNormal = normalize(up * cos(tilt) - axis * sin(tilt) + right * 0.16);\n  float denom = dot(d, ringNormal);\n  float ringT = dot(center, ringNormal) / (abs(denom) < 0.0001 ? 0.0001 : denom);\n  vec3 ringPos = d * ringT - center;\n  float ringR = length(ringPos) / max(planetRadius, 0.01);\n  float aa = clamp(fwidth(ringR), 0.001, 0.06);\n  float ringMask = smoothstep(1.27-aa, 1.27+aa, ringR) * (1.0-smoothstep(2.15-aa, 2.15+aa, ringR));\n  float gap = 1.0 - smoothstep(0.012, 0.022, abs(ringR - 1.77));\n  // Smooth high-frequency rings at distance instead of aliasing bright lines.\n  float frequencyFade = 1.0 - smoothstep(0.008, 0.035, aa);\n  float bands = 0.62 + 0.15 * sin(ringR * 95.0) * frequencyFade + 0.17 * sin(ringR * 27.0);\n  if (ringT > 0.0 && (hit < 0.0 || ringT < hit) && ringMask > 0.0) {\n    float shadow = skySphereHit(d * ringT + sun * 0.01, sun, center, planetRadius) > 0.0 ? 0.16 : 1.0;\n    vec3 rings = mix(uSecondaryColor, uPrimaryColor, clamp((ringR-1.27)/0.88, 0.0, 1.0));\n    color = mix(color, rings * bands * shadow, ringMask * (0.8 - gap * 0.75));\n  }\n#elif XRIFT_CELESTIAL_MODE == 3\n  vec2 local = uv / max(sin(radius), 0.001);\n  vec3 normal = vec3(local, sqrt(max(1.0 - dot(local, local), 0.0)));\n  vec3 p = normal * uScale * 7.0 + vec3(0.0, uTime * uSpeed * 0.025, uSeed);\n  float convection = skyDetail(p + skyDetail(p * 0.4) * 2.0);\n  float cells = pow(abs(sin(convection * 16.0)), 0.7);\n  float limb = pow(max(normal.z, 0.0), 0.4);\n  vec3 star = mix(uSecondaryColor, uPrimaryColor, cells) * (1.0 + limb * 1.8);\n  float corona = exp(-max(angle-radius, 0.0) * 20.0) * (1.0-disk);\n  float polar = atan(uv.y, uv.x);\n  corona *= 0.5 + 0.2 * sin(polar * 13.0 + uTime * uSpeed * 0.03) + 0.12 * sin(polar * 31.0);\n  color += uSecondaryColor * corona * 0.6;\n  color = mix(color, star, disk);\n#elif XRIFT_CELESTIAL_MODE == 4\n  vec3 p = d * uScale * 2.6 + vec3(uSeed, 0.0, uTime * uSpeed * 0.008);\n  float warp = skyDetail(p * 0.6);\n  float n = skyDetail(p + vec3(warp, -warp, warp) * 2.0);\n  float vein = skyDetail(p * 3.5 + n * 2.0);\n  float smoke = smoothstep(0.25, 0.75, n);\n  float dust = smoothstep(0.37, 0.67, vein);\n  color += mix(uPrimaryColor, uSecondaryColor, smoothstep(0.3, 0.68, n))\n    * smoke * (1.0 - dust * 0.87) * uNebulaStrength * 1.7;\n#elif XRIFT_CELESTIAL_MODE == 5\n  float polar = atan(uv.y, uv.x);\n  float petal = 0.62 + 0.2 * sin(polar * 6.0) + 0.12 * sin(polar * 13.0 + 1.3);\n  float corona = exp(-max(angle-radius, 0.0) / max(radius * 0.42 * petal, 0.001));\n  float ring = exp(-pow((angle - radius) / 0.003, 2.0));\n  color += uPrimaryColor * corona * 1.4 + uSecondaryColor * ring * 2.0;\n  // The occulting disc covers the stars as well as the corona.\n  color = mix(color, uGroundColor, disk);\n#endif\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#030612"},"uHorizonColor":{"kind":"color","value":"#121326"},"uGroundColor":{"kind":"color","value":"#010309"},"uPrimaryColor":{"kind":"color","value":"#ffd79b"},"uSeconda vec3 xriftSkyHash33(vec3 p) {\n  p = fract(p * vec3(0.1031, 0.1030, 0.0973));\n  p += dot(p, p.yxz + 33.33);\n  return fract((p.xxy + p.yxx) * p.zyx);\n}\n\nfloat xriftSkyNoise(vec3 p) {\n  vec3 cell = floor(p);\n  vec3 f = fract(p);\n  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n  float n000 = xriftSkyHash13(cell);\n  float n100 = xriftSkyHash13(cell + vec3(1.0, 0.0, 0.0));\n  float n010 = xriftSkyHash13(cell + vec3(0.0, 1.0, 0.0));\n  float n110 = xriftSkyHash13(cell + vec3(1.0, 1.0, 0.0));\n  float n001 = xriftSkyHash13(cell + vec3(0.0, 0.0, 1.0));\n  float n101 = xriftSkyHash13(cell + vec3(1.0, 0.0, 1.0));\n  float n011 = xriftSkyHash13(cell + vec3(0.0, 1.0, 1.0));\n  float n111 = xriftSkyHash13(cell + vec3(1.0, 1.0, 1.0));\n  return mix(\n    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n    f.z\n  );\n}\n\nfloat xriftSkyFbm(vec3 p) {\n  float total = 0.0;\n  float amplitude = 0.5;\n  for (int index = 0; index < 3; index += 1) {\n    total += xriftSkyNoise(p) * amplitude;\n    p *= 2.03;\n    amplitude *= 0.5;\n  }\n  return total;\n}\n\nvec3 xriftSkyRotateY(vec3 direction, float radiansAngle) {\n  float c = cos(radiansAngle);\n  float s = sin(radiansAngle);\n  return vec3(\n    c * direction.x - s * direction.z,\n    direction.y,\n    s * direction.x + c * direction.z\n  );\n}\n\n/** Direction of a sun or moon placed by compass azimuth and elevation. */\nvec3 xriftSkyBodyDirection(float azimuthDegrees, float elevationDegrees) {\n  float azimuth = radians(azimuthDegrees);\n  float elevation = radians(elevationDegrees);\n  float horizontal = cos(elevation);\n  return vec3(horizontal * cos(azimuth), sin(elevation), horizontal * sin(azimuth));\n}\n\n/**\n * One star per cell of a direction-space grid. `count` is the number of stars\n * wanted over the whole sphere; it becomes the probability that a given cell\n * holds one, so raising it adds stars without moving the existing ones.\n */\nfloat twinkleSpeed\n) {\n  return xriftSkyStarLayer(direction, 42.0, count * 0.5, size, time, twinkleSpeed)\n    + xriftSkyStarLayer(direction, 78.0, count * 0.32, size * 0.8, time, twinkleSpeed * 1.4) * 0.7\n    + xriftSkyStarLayer(direction, 134.0, count * 0.18, size * 0.62, time, twinkleSpeed * 0.8) * 0.45;\n}\n\n/**\n * Distant ridgeline. Returns 1 below the silhouette and 0 above it. The noise\n * is sampled around a circle, so the ridge closes on itself without a seam\n * where the first and last degree of azimuth meet.\n */\nfloat xriftSkyRidgeMask(vec3 direction, float height, float roughness, float seed) {\n  float azimuth = atan(direction.z, direction.x);\n  vec3 ring = vec3(cos(azimuth), sin(azimuth), seed) * max(roughness, 0.05);\n  float ridge = xriftSkyFbm(ring * 2.6) * 0.72 + xriftSkyFbm(ring * 6.1) * 0.28;\n  float silhouette = height * (0.25 + ridge * 1.35);\n  float aa = max(fwidth(direction.y - silhouette), 0.0015);\n  return 1.0 - smoothstep(silhouette - aa, silhouette + aa, direction.y);\n}\n\n/** Disc coverage in x and the surrounding glow in y, for a sun or a moon. */\nvec2 xriftSkyCelestial(\n  vec3 direction,\n  vec3 bodyDirection,\n  float angularRadius,\n  float glowFalloff\n) {\n  // Chord distance is stable near the disc centre; acos(dot) loses precision.\n  float angle = length(direction - bodyDirection);\n  float radius = 2.0 * sin(max(angularRadius, 0.0002) * 0.5);\n  float aa = max(fwidth(angle), 0.00008);\n  float disc = 1.0 - smoothstep(radius - aa, radius + aa, angle);\n  float glow = exp(-angle / max(glowFalloff, 0.002));\n  return vec2(disc, glow);\n}\n\n/**\n * Moon disc shading: the phase terminator plus surface mottling. `phase` runs\n * 0 (new) to 1 (full); the terminator is the standard ellipse, so a half moon\n * is a straight edge and a crescent bows the way the real one does.\n */\nfloat xriftSkyMoonShade(\n  vec3 direction,\n  vec3 moonDirection,\n  float angularRadius,\n  float phase\n) {\n  vec3 reference = abs(moonDirection.y) > 0.99\n    ? vec3(0.0, 0.0, 1.0)\n    : vec3(0.0, 1.0, 0.0);\n  vec3 right = normalize(cross(reference, moonDirection));\n  vec3 up = cross(moonDirection, right);\n  float radius = max(angularRadius, 0.002);\n  float u = dot(direction, right) / radius;\n  float v = dot(direction, up) / radius;\n  float terminator =\n    (1.0 - 2.0 * clamp(phase, 0.0, 1.0)) * sqrt(max(1.0 - v * v, 0.0));\n  float lit = smoothstep(terminator - 0.09, terminator + 0.09, u);\n  float mottle = xriftSkyFbm(vec3(u, v, 3.0) * 2.4);\n  // Earthshine keeps the unlit limb faintly readable instead of pure black.\n  return mix(0.07, 1.0, lit) * (0.78 + 0.34 * mottle);\n}\n\n/** Cloud cover on a flat plane above the viewer, drifting with time. */\nfloat xriftSkyClouds(\n  vec3 direction,\n  float coverage,\n  float scale,\n  float time,\n  float speed\n) {\n  if (direction.y <= 0.008) {\n    return 0.0;\n  }\n  vec2 plane = direction.xz / (direction.y + 0.14);\n  vec3 p = vec3(plane.x, plane.y, 0.0) * max(scale, 0.05);\n  p.x += time * speed * 0.03;\n  float density = xriftSkyFbm(p) + xriftSkyFbm(p * 2.7 + 5.0) * 0.4;\n  float cover = clamp(coverage, 0.0, 1.0);\n  float mask = smoothstep(1.05 - cover, 1.35 - cover, density);\n  return mask * smoothstep(0.0, 0.16, direction.y);\n}\n#ifndef XRIFT_SKY_DETAIL\n#define XRIFT_SKY_DETAIL 4\n#endif\n#ifndef XRIFT_SKY_CLOUD_STEPS\n#define XRIFT_SKY_CLOUD_STEPS 18\n#endif\n#ifndef XRIFT_SKY_AURORA_STEPS\n#define XRIFT_SKY_AURORA_STEPS 18\n#endif\n\nfloat skyDetail(vec3 p) {\n  float sum = 0.0;\n  float weight = 0.5333333;\n  const mat3 turn = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);\n  for (int i = 0; i < XRIFT_SKY_DETAIL; i++) {\n    sum += xriftSkyNoise(p) * weight;\n    p = turn * p * 2.03 + vec3(5.17, 1.39, 8.73);\n    weight *= 0.5;\n  }\n  return sum;\n}\n\nvec3 skyDirection() { return xriftSkyRotateY(normalize(vDirection), uRotation); }\nvec3 skyGradient(vec3 d) {\n  vec3 c = mix(uHorizonColor, uZenithColor, pow(max(d.y, 0.0), 0.48));\n  return mix(c, uGroundColor, (1.0 - smoothstep(-0.4, -0.015, d.y)));\n}\n\n// A stable spherical star pattern; only brightness twinkles, never positions.\nvec3 skyStars(vec3 d) {\n  float stars = xriftSkyStarField(d, uStarCount, uStarSize, uTime, uTwinkleSpeed);\n  float warmth = xriftSkyNoise(d * 87.0 + 31.0);\n  return mix(vec3(0.68, 0.79, 1.0), vec3(1.0, 0.88, 0.65), warmth)\n    * stars * uStarBrightness;\n}\n\nvec3 skyRight(vec3 axis) {\n  return normalize(cross(abs(axis.y) > 0.98 ? vec3(0,0,1) : vec3(0,1,0), axis));\n}\n\n// Tangent coordinates around a celestial body's centre. No UV seam at poles.\nvec2 skyBodyUV(vec3 d, vec3 axis) {\n  vec3 right = skyRight(axis);\n  return vec2(dot(d, right), dot(d, cross(axis, right)));\n}\n\nfloat skyDisc(vec3 d, vec3 axis, float radius) {\n  float chord = length(d - axis);\n  float r = 2.0 * sin(radius * 0.5);\n  float aa = max(fwidth(chord), 0.00008);\n  return 1.0 - smoothstep(r-aa, r+aa, chord);\n}\n\nfloat skySphereHit(vec3 ro, vec3 rd, vec3 center, float radius) {\n  vec3 oc = ro - center;\n  float b = dot(oc, rd);\n  float c = dot(oc, oc) - radius * radius;\n  float h = b * b - c;\n  if (h < 0.0) return -1.0;\n  float nearHit = -b - sqrt(h);\n  return nearHit > 0.0 ? nearHit : -1.0;\n}\n\nuniform float uBodyAzimuth;\nuniform float uBodyElevation;\nuniform float uBodySize;\nuniform float uPhase;\nuniform float uHaloRadius;\nuniform float uRingTilt;\nuniform float uNebulaStrength;\n#ifndef XRIFT_CELESTIAL_MODE\n#define XRIFT_CELESTIAL_MODE 0\n#endif\n\nvec3 galacticDust(vec3 d) {\n  vec3 axis = normalize(vec3(0.48, 0.35, -0.8));\n  float latitude = dot(d, axis);\n  float broad = exp(-latitude * latitude * 15.0);\n  float narrow = exp(-latitude * latitude * 95.0);\n  vec3 p = d * uScale * 3.2 + uSeed;\n  float structure = skyDetail(p);\n  float fine = skyDetail(p * 3.1 + structure * 2.5);\n  float darkLane = smoothstep(0.37, 0.63, fine) * narrow;\n  vec3 dust = mix(uPrimaryColor, uSecondaryColor, structure);\n  dust *= (broad * 0.15 + narrow * pow(structure, 2.0) * 2.2);\n  return dust * (1.0 - darkLane * 0.9) * uNebulaStrength;\n}\n\nvoid main() {\n  vec3 d = skyDirection();\n  vec3 axis = xriftSkyBodyDirection(uBodyAzimuth, uBodyElevation);\n  vec3 right = skyRight(axis);\n  vec3 up = cross(axis, right);\n  vec2 uv = skyBodyUV(d, axis);\n  float radius = radians(uBodySize);\n  float angle = length(d - axis);\n  float disk = skyDisc(d, axis, radius);\n  vec3 color = mix(uHorizonColor, uZenithColor, d.y * 0.5 + 0.5);\n  color += galacticDust(d) + skyStars(d);\n#if XRIFT_CELESTIAL_MODE == 0\n  float r = max(sin(radius), 0.0001);\n  vec2 local = uv / r;\n  vec3 normal = vec3(local, sqrt(max(1.0-dot(local,local), 0.0)));\n  float phaseAngle = (1.0 - uPhase) * 3.14159265;\n  float lit = max(dot(normal, vec3(sin(phaseAngle), 0.0, cos(phaseAngle))), 0.0);\n  float maria = smoothstep(0.25, 0.67, skyDetail(normal * 6.0 + uSeed));\n  float craters = skyDetail(normal * 23.0 + 3.0);\n  vec3 moon = uPrimaryColor * (0.53 + maria * 0.45 + craters * 0.17) * (0.035 + lit * 1.4);\n  color = mix(color, moon, disk);\n  float halo = exp(-pow((angle - radians(uHaloRadius)) / 0.018, 2.0));\n  color += uSecondaryColor * (halo * 0.07 + exp(-angle * 11.0) * 0.06) * uIntensity;\n  color = mix(uGroundColor, color, smoothstep(-0.12, 0.03, d.y));\n#elif XRIFT_CELESTIAL_MODE == 1\n  // The tilted galactic core and dark lanes occupy the whole dome.\n  color += galacticDust(xriftSkyRotateY(d, 0.16)) * 0.35;\n  color = mix(uGroundColor, color, smoothstep(-0.13, 0.04, d.y));\n#elif XRIFT_CELESTIAL_MODE == 2\n  // Analytic planet sphere and ray/plane ring intersection with correct depth.\n  float planetRadius = 5.0 * sin(radius);\n  vec3 center = axis * 5.0;\n  vec3 sun = normalize(-axis * 0.65 + right * 0.85 + up * 0.5);\n  float hit = skySphereHit(vec3(0.0), d, center, planetRadius);\n  vec3 n = normalize(d * max(hit, 0.001) - center);\n  float band = sin(n.y * 35.0 + skyDetail(n * 5.0 + uSeed) * 8.0);\n  float turbulence = skyDetail(n * 11.0 + uSeed);\n  vec3 surface = mix(uPrimaryColor, uSecondaryColor, clamp(0.45 + band * 0.24 + turbulence * 0.3, 0.0, 1.0));\n  surface *= 0.035 + max(dot(n, sun), 0.0) * 1.3;\n  float limb = pow(1.0 - max(dot(n, -d), 0.0), 3.0);\n  surface += uSecondaryColor * limb * max(dot(n, sun), 0.0) * 0.4;\n  if (hit > 0.0) color = mix(color, surface, disk);\n  float outer = exp(-pow((angle - radius) / 0.008, 2.0));\n  color += uSecondaryColor * outer * 0.14 * max(dot(d, sun) + 0.5, 0.0);\n  float tilt = radians(uRingTilt);\n  vec3 ringNormal = normalize(up * cos(tilt) - axis * sin(tilt) + right * 0.16);\n  float denom = dot(d, ringNormal);\n  float ringT = dot(center, ringNormal) / (abs(denom) < 0.0001 ? 0.0001 : denom);\n  vec3 ringPos = d * ringT - center;\n  float ringR = length(ringPos) / max(planetRadius, 0.01);\n  float aa = clamp(fwidth(ringR), 0.001, 0.06);\n  float ringMask = smoothstep(1.27-aa, 1.27+aa, ringR) * (1.0-smoothstep(2.15-aa, 2.15+aa, ringR));\n  float gap = 1.0 - smoothstep(0.012, 0.022, abs(ringR - 1.77));\n  // Smooth high-frequency rings at distance instead of aliasing bright lines.\n  float frequencyFade = 1.0 - smoothstep(0.008, 0.035, aa);\n  float bands = 0.62 + 0.15 * sin(ringR * 95.0) * frequencyFade + 0.17 * sin(ringR * 27.0);\n  if (ringT > 0.0 && (hit < 0.0 || ringT < hit) && ringMask > 0.0) {\n    float shadow = skySphereHit(d * ringT + sun * 0.01, sun, center, planetRadius) > 0.0 ? 0.16 : 1.0;\n    vec3 rings = mix(uSecondaryColor, uPrimaryColor, clamp((ringR-1.27)/0.88, 0.0, 1.0));\n    color = mix(color, rings * bands * shadow, ringMask * (0.8 - gap * 0.75));\n  }\n#elif XRIFT_CELESTIAL_MODE == 3\n  vec2 local = uv / max(sin(radius), 0.001);\n  vec3 normal = vec3(local, sqrt(max(1.0 - dot(local, local), 0.0)));\n  vec3 p = normal * uScale * 7.0 + vec3(0.0, uTime * uSpeed * 0.025, uSeed);\n  float convection = skyDetail(p + skyDetail(p * 0.4) * 2.0);\n  float cells = pow(abs(sin(convection * 16.0)), 0.7);\n  float limb = pow(max(normal.z, 0.0), 0.4);\n  vec3 star = mix(uSecondaryColor, uPrimaryColor, cells) * (1.0 + limb * 1.8);\n  float corona = exp(-max(angle-radius, 0.0) * 20.0) * (1.0-disk);\n  float polar = atan(uv.y, uv.x);\n  corona *= 0.5 + 0.2 * sin(polar * 13.0 + uTime * uSpeed * 0.03) + 0.12 * sin(polar * 31.0);\n  color += uSecondaryColor * corona * 0.6;\n  color = mix(color, star, disk);\n#elif XRIFT_CELESTIAL_MODE == 4\n  vec3 p = d * uScale * 2.6 + vec3(uSeed, 0.0, uTime * uSpeed * 0.008);\n  float warp = skyDetail(p * 0.6);\n  float n = skyDetail(p + vec3(warp, -warp, warp) * 2.0);\n  float vein = skyDetail(p * 3.5 + n * 2.0);\n  float smoke = smoothstep(0.25, 0.75, n);\n  float dust = smoothstep(0.37, 0.67, vein);\n  color += mix(uPrimaryColor, uSecondaryColor, smoothstep(0.3, 0.68, n))\n    * smoke * (1.0 - dust * 0.87) * uNebulaStrength * 1.7;\n#elif XRIFT_CELESTIAL_MODE == 5\n  float polar = atan(uv.y, uv.x);\n  float petal = 0.62 + 0.2 * sin(polar * 6.0) + 0.12 * sin(polar * 13.0 + 1.3);\n  float corona = exp(-max(angle-radius, 0.0) / max(radius * 0.42 * petal, 0.001));\n  float ring = exp(-pow((angle - radius) / 0.003, 2.0));\n  color += uPrimaryColor * corona * 1.4 + uSecondaryColor * ring * 2.0;\n  // The occulting disc covers the stars as well as the corona.\n  color = mix(color, uGroundColor, disk);\n#endif\n  color *= uIntensity;\n\n  gl_FragColor = vec4(max(color, vec3(0.0)) * max(uExposure, 0.0), 1.0);\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n}","uniforms":{"uCenter":{"kind":"vector","value":[0,0,0]},"uRotation":{"kind":"number","value":0},"uExposure":{"kind":"number","value":1},"uTime":{"kind":"number","value":0},"uZenithColor":{"kind":"color","value":"#030612"},"uHorizonColor":{"kind":"color","value":"#121326"},"uGroundColor":{"kind":"color","value":"#010309"},"uPrimaryColor":{"kind":"color","value":"#4c92bd"},"uSecondaryColor":{"kind":"color","value":"#d68aab"},"uScale":{"kind":"number","value":1.45}
