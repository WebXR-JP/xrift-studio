<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:'Yu Gothic UI','Meiryo',sans-serif}</style><rect width="1920" height="1080" fill="#f8fafc"/><text x="120" y="150" font-size="66" fill="#0f172a" font-weight="600">GLSLで色や模様を書く</text><rect x="120" y="290" width="1680" height="500" rx="28" fill="white" stroke="#ddd6fe" stroke-width="2"/><text x="200" y="445" font-size="110" fill="#7c3aed" font-weight="600">GLSL</text><text x="620" y="445" font-size="64" fill="#0f172a" font-weight="600">色や模様をコードで作る</text><text x="200" y="630" font-size="56" fill="#334155" font-weight="600">時間で色が変わる表面などに使えます</text></svg>