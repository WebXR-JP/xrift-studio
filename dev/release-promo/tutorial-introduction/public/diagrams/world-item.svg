<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:'Yu Gothic UI','Meiryo',sans-serif}</style><rect width="1920" height="1080" fill="#f8fafc"/><text x="120" y="150" font-size="66" fill="#0f172a" font-weight="600">ワールドは空間／アイテムは個別の物</text><rect x="120" y="290" width="800" height="500" rx="28" fill="white" stroke="#ddd6fe" stroke-width="2"/><rect x="1000" y="290" width="800" height="500" rx="28" fill="white" stroke="#ddd6fe" stroke-width="2"/><text x="175" y="415" font-size="82" fill="#7c3aed" font-weight="600">ワールド</text><text x="175" y="535" font-size="60" fill="#0f172a" font-weight="600">人が入る空間</text><text x="175" y="635" font-size="46" fill="#334155" font-weight="600">展示会場や部屋など</text><text x="1055" y="415" font-size="82" fill="#7c3aed" font-weight="600">アイテム</text><text x="1055" y="535" font-size="54" fill="#0f172a" font-weight="600">その中で使う個別の物</text></svg>