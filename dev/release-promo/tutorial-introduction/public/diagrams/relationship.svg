<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:'Yu Gothic UI','Meiryo',sans-serif}</style><rect width="1920" height="1080" fill="#f8fafc"/><text x="120" y="150" font-size="66" fill="#0f172a" font-weight="600">XRiftで体験する／Studioで制作する</text><rect x="120" y="290" width="720" height="500" rx="28" fill="white" stroke="#ddd6fe" stroke-width="2"/><rect x="1080" y="290" width="720" height="500" rx="28" fill="white" stroke="#ddd6fe" stroke-width="2"/><text x="170" y="410" font-size="86" fill="#7c3aed" font-weight="600">XRift Studio</text><text x="170" y="510" font-size="46" fill="#0f172a" font-weight="600">ワールドやアイテムを作る</text><text x="170" y="600" font-size="42" fill="#334155" font-weight="600">有志開発の制作ツール</text><text x="1130" y="410" font-size="86" fill="#7c3aed" font-weight="600">XRift</text><text x="1130" y="510" font-size="46" fill="#0f172a" font-weight="600">ブラウザでワールドに入る</text><text x="1130" y="600" font-size="42" fill="#334155" font-weight="600">人と交流するサービス</text><path d="M875,540 H1027 M1007,522 L1027,540 L1007,558" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="905" y="480" font-size="42" fill="#7c3aed" font-weight="600">公開</text></svg>