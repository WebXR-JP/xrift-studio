<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XRift Studio · Ocean Shader Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#202b38;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:white;border-bottom:1px solid #dce1e7;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}header b{font-size:18px}header span{font-size:11px;color:#677789}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 66px)}.stage{position:relative;min-width:0;display:flex;flex-direction:column}#water{display:block;width:100%;height:calc(100% - 90px);min-height:320px}.caption{padding:14px 24px;background:#fff;border-top:1px solid #dce1e7;min-height:90px}h1{font-size:20px;margin:0 0 6px}.caption p{margin:0;font-size:12px;color:#657486;line-height:1.6}aside{overflow-y:auto;padding:18px;background:white;border-left:1px solid #dce1e7}select,button{border:1px solid #cbd3dd;border-radius:6px;padding:8px;background:#fff;color:inherit;font-size:12px}select{width:100%;margin:6px 0 13px}button{cursor:pointer}.row{display:flex;gap:8px;margin:5px 0 14px}.row button{flex:1}label{font-size:12px;line-height:1.7}.toggle{display:block;margin-bottom:8px}.control{display:grid;grid-template-columns:1fr auto;gap:5px;border-top:1px solid #edf0f3;padding:10px 0}.control input{grid-column:1/-1;width:100%}output{font-variant-numeric:tabular-nums;color:#64748b;font-size:11px}small{font-size:10px;line-height:1.7;color:#697888;display:block;margin:12px 0}#features{font-size:11px;color:#36677a;margin:10px 0 15px}#error{position:absolute;top:16px;left:16px;right:16px;white-space:pre-wrap;background:#ffebea;color:#9b2424;font-size:12px;max-height:50%;overflow:auto}#error:empty{display:none}input{accent-color:#456e87}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#water{height:55vh}aside{border-top:1px solid #dce1e7;border-left:0}.caption{min-height:100px}header{padding:14px}}
</style>
<header><b>XRift Studio <span> / OCEAN SHADER LAB</span></b><span>21 PRESETS · 8 CATEGORIES · WEBGL2</span></header>
<main><section class="stage"><canvas id="water"></canvas><div id="error"></div><div class="caption"><h1 id="title"></h1><p id="description"></p></div></section>
<aside><label for="preset">海のプリセット</label><select id="preset"></select><div id="features"></div><div class="row"><button id="play">一時停止</button><button id="reset">既定値へ戻す</button></div>
<label for="camera">見る角度</label><select id="camera"><option value="0">水面を低めの角度から</option><option value="1">上から見下ろす</option><option value="2">水面の下から</option></select>
<label for="quality">細部の品質</label><select id="quality"><option value="0">軽量（雲模様・雨の波紋なし）</option><option value="1" selected>標準</option><option value="2">高精細</option></select>
<label class="toggle"><input type="checkbox" id="displace"> 分割メッシュで頂点変位</label><label class="toggle"><input type="checkbox" id="wind" checked> 試し風を有効にする</label><label class="toggle"><input type="checkbox" id="fog"> Fogの描画を確認</label>
<div id="controls"></div><small>同梱のGLSLをWebGL2で直接描画する確認用ページです。照明・灰色の水底・背景は見本で、Studio本体の実行画面ではありません。太陽・月の向きや色は、StudioではSceneの主Directional Lightに従います。</small>
<small>反射は指定した空色の近似です。地形の自動検出・物体の映り込み・画面屈折はありません。寄せ波は岸の位置と方角を手動で合わせます。頂点変位は分割済みの水平メッシュで使用します。</small></aside></main>
<script id="catalog-data" type="application/json">__CATALOG_JSON__</script><script>__LAB_JS__</script></html>
