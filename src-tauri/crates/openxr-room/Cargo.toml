[package]
name = "xrift-openxr-room"
version = "0.1.0"
edition = "2021"

[features]
default = ["bundled-loader"]
bundled-loader = ["openxr/static"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
openxr = { version = "0.21.1", default-features = false, features = ["loaded"] }
windows = { version = "0.61.3", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
