name: ChatGPT Editor integration
on:
  pull_request:
    paths:
      - 'src-tauri/src/chatgpt.rs'
      - 'src-tauri/src/chatgpt/**'
      - 'src-tauri/Cargo.*'
      - 'src/components/visual-editor/Chatgpt*.tsx'
      - 'src/components/visual-editor/AiConnectionPanel.tsx'
      - 'src/components/visual-editor/McpConnectionSettings.tsx'
      - 'src/components/AboutModal.tsx'
      - 'src/components/ProjectLibrary.tsx'
      - 'src/components/StudioLoading.tsx'
      - 'src/components/ModelViewer.tsx'
      - 'src/components/visual-editor/*Preview*.tsx'
      - 'src/components/visual-editor/*Thumbnail*.tsx'
      - 'src/components/visual-editor/AssetQuickEditor.tsx'
      - 'src/components/visual-editor/EditorDialog.tsx'
      - 'src/components/visual-editor/EditorUtilityRail.tsx'
      - 'src/components/visual-editor/SceneViewport.tsx'
      - 'src/components/visual-editor/VisualEditorPrototype.tsx'
      - 'src/App.tsx'
      - 'src/lib/tauri.ts'
      - 'src/lib/visual-editor/mcp-tool-registry.ts'
      - 'src/lib/visual-editor/canvas-events.ts'
      - 'src-tauri/src/mcp.rs'
      - 'src-tauri/src/mcp_tool_names.rs'
      - 'src-tauri/src/lib.rs'
      - 'e2e/chatgpt-tabs.spec.ts'
      - 'e2e/bootstrap-recovery.spec.ts'
      - 'e2e/canvas-event-lifecycle.*'
      - 'src/*-bootstrap.tsx'
      - 'src/lib/application-bootstrap.*'
      - 'src/release-e2e/mock-tauri.ts'
      - 'src/lib/visual-editor/chatgpt-*.ts'
      - 'scripts/chatgpt-world.test.mjs'
      - 'scripts/chatgpt-generation.test.mjs'
      - 'scripts/mcp-chatgpt-contract.test.mjs'
      - 'scripts/chatgpt-panel-ui.mjs'
      - 'scripts/generate-mcp-tool-names.mjs'
      - 'docs/guide/ai-connection.md'
      - 'docs/guide/manifest.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/chatgpt-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm e2e:typecheck
      - run: pnpm mcp:tool-names --check
      - run: node --test scripts/chatgpt-world.test.mjs scripts/chatgpt-generation.test.mjs scripts/mcp-chatgpt-contract.test.mjs scripts/guide.test.mjs
      - name: Verify real panel UI with isolated native IPC
        env:
          XRIFT_TEST_CHROME: /usr/bin/google-chrome
        run: node scripts/chatgpt-panel-ui.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Editor tabs and MCP generation through the real App
        run: pnpm exec playwright test e2e/chatgpt-tabs.spec.ts e2e/bootstrap-recovery.spec.ts e2e/canvas-event-lifecycle.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-panel-ui
          path: |
            dev/chatgpt-ui-artifacts
            test-results
            playwright-report
          if-no-files-found: ignore
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libdbus-1-dev
      - name: Check native integration and dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test authentication, MCP, saves and publication records
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
