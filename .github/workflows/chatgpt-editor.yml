name: ChatGPT Editor integration
on:
  pull_request:
    paths:
      - 'src-tauri/src/chatgpt.rs'
      - 'src-tauri/Cargo.*'
      - 'src/components/visual-editor/ChatgptWorldPanel.tsx'
      - 'src/lib/visual-editor/chatgpt-world.ts'
      - 'scripts/chatgpt-world.test.mjs'
      - '.github/workflows/chatgpt-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/chatgpt-world.test.mjs scripts/guide.test.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev
      - name: Check native integration and dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test authentication validation and native streaming
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib chatgpt::tests
