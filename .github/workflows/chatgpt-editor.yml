name: ChatGPT Editor integration
on:
  pull_request:
    paths:
      - 'src-tauri/src/chatgpt.rs'
      - 'src-tauri/src/chatgpt/**'
      - 'src-tauri/src/blender_modeling.*'
      - 'src-tauri/src/external_store.rs'
      - 'src-tauri/Cargo.*'
      - 'src/components/visual-editor/Chatgpt*.tsx'
      - 'src/components/visual-editor/AiConnectionPanel.tsx'
      - 'src/components/visual-editor/McpConnectionSettings.tsx'
      - 'src/components/AboutModal.tsx'
      - 'src/components/ProjectLibrary.tsx'
      - 'src/components/StudioLoading.tsx'
      - 'src/components/visual-editor/CodeEditorLoading.tsx'
      - 'src/components/ModelViewer.tsx'
      - 'src/components/visual-editor/*Preview*.tsx'
      - 'src/components/visual-editor/*Thumbnail*.tsx'
      - 'src/components/visual-editor/AssetQuickEditor.tsx'
      - 'src/components/visual-editor/EditorDialog.tsx'
      - 'src/components/visual-editor/EditorUtilityRail.tsx'
      - 'src/components/visual-editor/SceneViewport.tsx'
      - 'src/components/visual-editor/VisualEditorPrototype.tsx'
      - 'src/App.tsx'
      - 'src/lib/tauri.ts'
      - 'src/lib/script-modules.ts'
      - 'src/lib/monaco.ts'
      - 'src/lib/visual-editor/mcp-tool-registry.ts'
      - 'src/lib/visual-editor/canvas-events.ts'
      - 'src-tauri/src/mcp.rs'
      - 'src-tauri/src/mcp_tool_names.rs'
      - 'src-tauri/src/lib.rs'
      - 'e2e/chatgpt-*.ts'
      - 'e2e/model-assignment.*'
      - 'src/lib/visual-editor/external-store.ts'
      - 'src/lib/visual-editor/model-assignment.ts'
      - 'src/components/visual-editor/ChatgptSessionBar.tsx'
      - 'src/components/visual-editor/useChatgptSessions.ts'
      - 'e2e/publish-readiness-race.spec.ts'
      - 'e2e/editor-ui-polish.spec.ts'
      - 'e2e/script-workspace.spec.ts'
      - 'e2e/bootstrap-recovery.spec.ts'
      - 'e2e/canvas-event-lifecycle.*'
      - 'src/*-bootstrap.tsx'
      - 'src/lib/application-bootstrap.*'
      - 'src/release-e2e/mock-tauri.ts'
      - 'src/lib/visual-editor/chatgpt-*.ts'
      - 'src/lib/visual-editor/pi-*.ts'
      - 'src/components/visual-editor/Pi*.tsx'
      - 'packages/studio-pi/**'
      - 'scripts/prepare-pi-runtime.mjs'
      - 'scripts/prepare-mcp-sidecar.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'src/components/visual-editor/useChatgptRequestQueue.ts'
      - 'src/lib/visual-editor/asset-import.ts'
      - 'src/lib/browser-project-storage.ts'
      - 'src/lib/ai-lowpoly-props-store.ts'
      - 'src/lib/shared-material-library-store.ts'
      - 'src/lib/glb-container.ts'
      - 'src/lib/visual-editor/*catalog*.ts'
      - 'src/lib/visual-editor/*presets*.ts'
      - 'src/lib/visual-editor/*recipes*.ts'
      - 'src/lib/visual-editor/scene-recipe*.ts'
      - 'src/lib/visual-editor/scripting/*recipe*.ts'
      - 'src/lib/visual-editor/particle-system.ts'
      - 'src/lib/visual-editor/component-registry.ts'
      - 'src/lib/visual-editor/scene-document.ts'
      - 'src/lib/visual-editor/scene-settings.ts'
      - 'src/lib/visual-editor/sky-shader.ts'
      - 'src/lib/visual-editor/starter-templates.ts'
      - 'src/lib/visual-editor/editor-session.ts'
      - 'src/lib/visual-editor/asset-manifest.ts'
      - 'scripts/chatgpt-*.test.mjs'
      - 'scripts/uikit-authoring.test.mjs'
      - 'scripts/world-design-guide.test.mjs'
      - 'scripts/component-code-authoring.test.mjs'
      - 'scripts/prefab-authoring.test.mjs'
      - 'src/lib/visual-editor/prefab-document.ts'
      - 'e2e/uikit-*'
      - 'e2e/prepare-uikit-export.ts'
      - 'e2e/spatial-ui-authoring.spec.ts'
      - 'src/lib/visual-editor/world-authoring-guide.json'
      - 'scripts/generate-authoring-skill.mjs'
      - 'scripts/glb-import-size.test.mjs'
      - 'scripts/glb-store-size.test.mjs'
      - 'scripts/model-assignment.test.mjs'
      - 'scripts/external-store-merge.test.mjs'
      - 'scripts/mcp-chatgpt-contract.test.mjs'
      - 'scripts/vite-guide.mjs'
      - 'scripts/vite-guide.test.mjs'
      - 'scripts/generate-mcp-tool-names.mjs'
      - 'docs/guide/ai-connection.md'
      - 'docs/guide/manifest.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/chatgpt-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm e2e:typecheck
      - run: pnpm mcp:tool-names --check
      - run: node --test scripts/chatgpt-generation.test.mjs scripts/chatgpt-sessions.test.mjs scripts/chatgpt-live-scene.test.mjs scripts/chatgpt-request-queue.test.mjs scripts/chatgpt-modeling.test.mjs scripts/glb-import-size.test.mjs scripts/glb-store-size.test.mjs scripts/model-assignment.test.mjs scripts/external-store-merge.test.mjs scripts/mcp-chatgpt-contract.test.mjs scripts/guide.test.mjs scripts/vite-guide.test.mjs
      - run: node scripts/sync-agent-skills.mjs --check
      - run: node --test scripts/uikit-authoring.test.mjs scripts/world-design-guide.test.mjs scripts/component-code-authoring.test.mjs scripts/prefab-authoring.test.mjs
      - run: pnpm pi:test
      - run: node --test scripts/chatgpt-authoring-host.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Pi authoring through the real App and official Editor tools
        run: pnpm exec playwright test e2e/chatgpt-pi-authoring.spec.ts e2e/chatgpt-connection-reasoning.spec.ts e2e/model-assignment.spec.ts e2e/bootstrap-recovery.spec.ts e2e/canvas-event-lifecycle.spec.ts e2e/publish-readiness-race.spec.ts e2e/editor-ui-polish.spec.ts e2e/script-workspace.spec.ts e2e/uikit-and-entity-chat.spec.ts e2e/spatial-ui-authoring.spec.ts
      - name: Verify UIKit in the minified desktop build
        run: pnpm e2e:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-authoring-ui
          path: |
            test-results
            playwright-report
            test-results-production
            playwright-report-production
          if-no-files-found: ignore
  native:
    # Native checks use their own checkout and exclude generated app resources.
    # They do not depend on frontend artifacts; keep both checks independent.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libdbus-1-dev
      - name: Check native integration and dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test authentication, MCP, saves and publication records
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
