name: Native OpenXR room
on:
  pull_request:
    paths:
      - 'src-tauri/crates/openxr-room/**'
      - 'src-tauri/src/openxr_room.rs'
      - '.github/workflows/openxr-room.yml'
      - 'src/components/visual-editor/**'
      - 'src/lib/tauri.ts'
      - 'src/lib/visual-editor/value-up/spatial-xr/**'
      - 'src-tauri/src/lib.rs'
      - 'docs/**'
      - 'scripts/native-room.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-loader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and test native reader with bundled OpenXR loader
        run: cargo test --locked --manifest-path src-tauri/crates/openxr-room/Cargo.toml

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/native-room.test.mjs scripts/guide.test.mjs
      - run: node scripts/generate-mcp-tool-names.mjs --check
