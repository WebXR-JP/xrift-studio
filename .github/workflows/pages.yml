name: Deploy web preview

on:
  push:
    branches: [main]
  # 紹介ページはダウンロード導線に最新リリースを埋め込んでいる。リリースが
  # 公開された時点で再デプロイして、ページが持つスナップショットを更新する。
  # リリースの作り方 (release.yml) は変えていない。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 使い方ガイドは wiki/index.html として最初からその階層に出力される。
      # 以前はビルド後に wiki.html を wiki/ へ移していたが、相対パスの基準が
      # ずれてJSとCSSが全て404になり、公開版が白紙になっていた。
      # build:preview には公開ページが自分のアセットを解決できるかの検査が
      # 含まれているので、同じ壊れ方が黙って再発することはない。
      # 埋め込むのは最新リリースのタグ、ファイル名、サイズ、SHA-256 だけで、
      # ページは表示後に GitHub API へ問い合わせて自分を更新する。取得に
      # 失敗してもビルドは止めず、コミット済みのスナップショットを使う。
      - name: Refresh release snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-release-snapshot.mjs

      - name: Build web preview
        run: |
          pnpm run build:preview
          mv preview-dist/preview.html preview-dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
